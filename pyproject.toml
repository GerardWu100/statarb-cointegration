[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statarb-cointegration"
version = "0.1.0"
description = "Tests and backtests a fixed KO-PEP cointegration relation with causal signals, matched holdings, explicit costs, and daily marking."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.2",
    "pyarrow>=20.0",
    "matplotlib>=3.10",
    "statsmodels>=0.14.6",
]

[project.scripts]
statarb-pipeline = "statarb_cointegration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
